name: "supermario"
uac: true
icon: "icons/icon.png"
profiles:
  - name: "China"
    git_url: "https://github.com/lifetraveler/supermario.git"
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true

  - name: "Global"
    git_url: "https://github.com/lifetraveler/supermario.git"
    requirements: "requirements.txt"
    pip_args: "--no-deps"

  - name: "Web"
    main_script: "web_main.py"
    requires_python: "3.12"
    requirements: "requirements-web.txt"
    pip_args: "--no-deps"
    use_pythonw: true
