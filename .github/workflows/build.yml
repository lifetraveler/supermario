name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
          }

      - name: Sync Repositories # 同步 deploy.txt 中的文件到独立更新库, 减小用户更新时的 git 仓库体积
        id: sync
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://lifetraveler:${{ secrets.UPDATE_REPO_TOKEN }}@github.com/lifetraveler/supermario-update.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true #在更新日志中加入作者

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            ###  更新日志 ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}:
              ${{ steps.sync.outputs.changes_with_asterisk }}
            ### 下载包说明
              * [supermario-win32-China-setup.exe](https://github.com/lifetraveler/supermario/releases/download/${{ github.ref_name }}/supermario-win32-China-setup.exe) 完整安装包（国内网络优化更新源）
              * [supermario-win32-Global-setup.exe](https://github.com/lifetraveler/supermario/releases/download/${{ github.ref_name }}/supermario-win32-Global-setup.exe) 完整安装包（GitHub 更新源）
              * [supermario-win32-Web-setup.exe](https://github.com/lifetraveler/supermario/releases/download/${{ github.ref_name }}/supermario-win32-Web-setup.exe) Web UI 完整安装包
          files: pyappify_dist/*
